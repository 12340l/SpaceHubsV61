<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; overflow-y: auto;">
      <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent: #404040;
            --nav-bg: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            background-attachment: fixed;
        }

        #site-header {
            padding: 30px 20px 10px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            margin: 0 0 10px 0;
        }

        #search-bar {
            display: flex;
            justify-content: center;
            padding: 10px 20px 20px;
        }

        #searchInput {
            padding: 12px 20px;
            width: 100%;
            max-width: 420px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: border 0.2s, background 0.2s;
        }

        #searchInput::placeholder { color: #888; }
        #searchInput:focus {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.13);
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            width: 95%;
            max-width: 1400px;
            margin: 10px auto 60px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 22px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .game-card h2 {
            margin: 0 0 6px 0;
            font-size: 1rem;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .game-card p {
            color: #aaaaaa;
            margin: 0;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .game-card.hidden { display: none; }

        /* Overlay */
        #game-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            display: none;
            z-index: 100;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #back-btn {
            position: absolute;
            top: 20px; left: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 110;
            font-size: 14px;
        }

        #back-btn:hover { background: rgba(255,255,255,0.25); }

        @media (max-width: 1200px) { #game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 900px)  { #game-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px)  { #game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 380px)  { #game-grid { grid-template-columns: 1fr; } }
      </style>

      <div id="site-header">
          <h1>Space Games Site</h1>
      </div>

      <div id="search-bar">
          <input type="text" id="searchInput" placeholder="Search games..." autocomplete="off" oninput="filterGames()" />
      </div>

