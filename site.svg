      <div id="game-overlay">
          <button id="back-btn" onclick="closeGame()">Back to Games</button>
          <iframe id="game-frame" src=""></iframe>
      </div>

      <!-- Include your app logic script -->
      <script src="app.js"></script>
    </div>
  </foreignObject>
</svg>
